<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Squat & Hinge Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TensorFlow.js and MoveNet Pose Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    
    <!-- Tone.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Make canvas act as a fullscreen background */
        }
        
        /* Hide the video element robustly for all mobile browsers */
        video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -10;
            pointer-events: none;
        }
        
        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-value {
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        /* Hide scrollbar for compact view */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-white">

    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0">
        <!-- Added playsinline muted autoplay to prevent mobile native controls -->
        <video id="video" playsinline muted autoplay></video>
        <canvas id="output-canvas"></canvas>
    </div>

    <!-- Right Side: Unified Controls & Data HUD -->
    <div class="absolute top-2 right-2 bottom-2 z-10 flex flex-col gap-2 w-36 sm:w-44 pointer-events-none overflow-y-auto no-scrollbar pb-2">
        
        <!-- Exercise Type Selector (Horizontal layout) -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg pointer-events-auto">
            <div class="text-[9px] font-bold text-gray-400 mb-1.5 tracking-wider uppercase text-center">Exercise</div>
            <div class="flex gap-1 justify-between">
                <button id="btn-squat" class="ex-btn flex-1 py-1.5 bg-blue-600 text-white rounded text-[9px] font-bold transition-colors">Squat</button>
                <button id="btn-bulgarian" class="ex-btn flex-1 py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded text-[9px] font-bold transition-colors">Split</button>
                <button id="btn-hinge" class="ex-btn flex-1 py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded text-[9px] font-bold transition-colors">Hinge</button>
            </div>
        </div>

        <!-- Target Hold Time Settings -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg pointer-events-auto">
            <div class="flex justify-between items-center mb-1.5">
                <div class="text-[9px] font-bold text-gray-400 tracking-wider uppercase">Hold Target</div>
                <span id="hold-display" class="text-blue-400 font-bold text-[10px]">2.0s</span>
            </div>
            <input type="range" id="hold-slider" min="0" max="5" step="0.5" value="2">
        </div>

        <!-- Current State -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg pointer-events-auto">
            <div class="text-[9px] text-gray-400 font-bold tracking-wider mb-0.5 uppercase">Status</div>
            <div id="current-state" class="text-sm sm:text-base font-black text-blue-400 tracking-tight leading-tight">STANDING</div>
        </div>

        <!-- Joint Angle -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg pointer-events-auto">
            <div id="angle-label" class="text-[9px] text-gray-400 font-bold tracking-wider mb-0.5 uppercase">Knee Angle</div>
            <div class="flex items-baseline gap-1">
                <div id="angle-value" class="text-xl sm:text-2xl font-black metric-value">--</div>
                <div class="text-[10px] text-gray-400">°</div>
            </div>
            <div class="w-full bg-gray-700 h-1 rounded-full mt-1.5 overflow-hidden">
                <div id="angle-bar" class="bg-blue-500 h-full w-full transition-all duration-100"></div>
            </div>
            <div class="flex justify-between text-[7px] text-gray-500 mt-1 font-medium">
                <span id="angle-min">90°</span>
                <span id="angle-max">160°</span>
            </div>
        </div>

        <!-- Torso Angle -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg pointer-events-auto">
            <div class="text-[9px] text-gray-400 font-bold tracking-wider mb-0.5 uppercase">Torso Angle</div>
            <div class="flex items-baseline gap-1">
                <div id="torso-value" class="text-xl sm:text-2xl font-black metric-value">--</div>
                <div class="text-[10px] text-gray-400">°</div>
            </div>
            <div class="flex justify-between text-[7px] text-gray-500 mt-1 font-medium">
                <span>0°</span>
                <span>90°</span>
            </div>
        </div>

        <!-- Hold Time -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg pointer-events-auto">
            <div class="text-[9px] text-gray-400 font-bold tracking-wider mb-0.5 uppercase">Hold Time</div>
            <div class="flex items-baseline gap-1">
                <div id="hold-value" class="text-xl sm:text-2xl font-black metric-value text-white transition-colors duration-200">0.0</div>
                <div class="text-[10px] text-gray-400">sec</div>
            </div>
        </div>

        <!-- Rep Counter -->
        <div class="glass-panel p-2.5 rounded-xl shadow-lg border-t border-t-emerald-500 pointer-events-auto">
            <div id="rep-title" class="text-[9px] text-emerald-400 font-bold tracking-wider mb-0.5 uppercase">Squat Reps</div>
            <div id="rep-value" class="text-3xl sm:text-4xl font-black metric-value text-white leading-none">0</div>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-500">
        <div class="text-center max-w-md px-6">
            <h1 class="text-4xl font-black text-white mb-4 tracking-tight">AI Form Tracker</h1>
            <p class="text-gray-400 mb-8 text-sm">Place your device on the floor leaning against a wall. Ensure your full body is in the frame side-on.</p>
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-12 rounded-full shadow-lg shadow-blue-500/30 transition-all transform hover:scale-105 active:scale-95 text-lg">
                Enable Camera & Start
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        
        const stateEl = document.getElementById('current-state');
        const angleValueEl = document.getElementById('angle-value');
        const angleBarEl = document.getElementById('angle-bar');
        const angleLabelEl = document.getElementById('angle-label');
        const torsoValueEl = document.getElementById('torso-value');
        const holdValueEl = document.getElementById('hold-value');
        const repValueEl = document.getElementById('rep-value');
        const repTitleEl = document.getElementById('rep-title');
        const holdDisplayEl = document.getElementById('hold-display');
        const holdSlider = document.getElementById('hold-slider');

        // Logic Variables
        let detector;
        let isRunning = false;
        let repCount = 0;
        let currentState = "UP"; // UP, GOING_DOWN, DOWN, GOING_UP
        
        let holdStartTime = 0;
        let currentHoldTime = 0;
        let targetHoldTime = 2.0;
        let hasPlayedHoldSound = false;

        // Exercise Settings
        let currentExercise = "SQUAT"; // SQUAT, BULGARIAN, HINGE
        let ANGLE_DOWN = 90;
        let ANGLE_UP = 150;

        // Audio Synth
        let synth;

        function initAudio() {
            // Initialize Tone.js Synth on user interaction
            synth = new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 1 }
            }).toDestination();
        }

        // UI Listeners
        startBtn.addEventListener('click', async () => {
            initAudio();
            startBtn.innerText = "Loading AI Model...";
            startBtn.disabled = true;
            await initApp();
            startOverlay.classList.add('opacity-0');
            setTimeout(() => startOverlay.style.display = 'none', 500);
        });

        holdSlider.addEventListener('input', (e) => {
            targetHoldTime = parseFloat(e.target.value);
            holdDisplayEl.innerText = targetHoldTime.toFixed(1) + "s";
        });

        const exBtns = {
            'SQUAT': document.getElementById('btn-squat'),
            'BULGARIAN': document.getElementById('btn-bulgarian'),
            'HINGE': document.getElementById('btn-hinge')
        };

        function setExercise(type) {
            currentExercise = type;
            
            // Reset styles
            Object.values(exBtns).forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-700', 'text-gray-300');
            });
            
            // Set active style
            exBtns[type].classList.add('bg-blue-600', 'text-white');
            exBtns[type].classList.remove('bg-gray-700', 'text-gray-300');

            // Update Logic Thresholds & UI Labels (Shortened strings for tight layout)
            if (type === "SQUAT") {
                ANGLE_DOWN = 90;
                angleLabelEl.innerText = "KNEE ANGLE";
                repTitleEl.innerText = "SQUAT REPS";
                document.getElementById('angle-min').innerText = "90°";
            } else if (type === "BULGARIAN") {
                ANGLE_DOWN = 100;
                angleLabelEl.innerText = "KNEE ANGLE";
                repTitleEl.innerText = "SPLIT REPS";
                document.getElementById('angle-min').innerText = "100°";
            } else if (type === "HINGE") {
                ANGLE_DOWN = 100; // Tracking Hip Angle instead of Knee
                angleLabelEl.innerText = "HIP ANGLE";
                repTitleEl.innerText = "HINGE REPS";
                document.getElementById('angle-min').innerText = "100°";
            }
        }

        exBtns['SQUAT'].addEventListener('click', () => setExercise('SQUAT'));
        exBtns['BULGARIAN'].addEventListener('click', () => setExercise('BULGARIAN'));
        exBtns['HINGE'].addEventListener('click', () => setExercise('HINGE'));

        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error("Browser API navigator.mediaDevices.getUserMedia not available");
            }
            
            // Adjust camera ideal resolution based on device width to support mobile portrait modes gracefully
            const isMobile = window.innerWidth < 640 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: 'user',
                    // Request portrait dimensions (height > width) for mobile, landscape for desktop
                    width: isMobile ? { ideal: 720 } : { ideal: 1280 },
                    height: isMobile ? { ideal: 1280 } : { ideal: 720 }
                }
            });
            video.srcObject = stream;
            
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    // Set internal canvas resolution to match raw video feed
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve(video);
                };
            });
        }

        async function loadModel() {
            const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
            detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);
        }

        // Math Helpers
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return Math.round(angle);
        }

        function calculateTorsoAngle(shoulder, hip) {
            // Angle from true vertical (Y axis). 
            // 0 = standing perfectly upright, 90 = leaning forward parallel to floor
            const dx = Math.abs(shoulder.x - hip.x);
            const dy = Math.abs(shoulder.y - hip.y);
            let angle = Math.atan2(dx, dy) * (180.0 / Math.PI);
            return Math.round(angle);
        }

        async function detectPose() {
            if (!isRunning) return;

            const poses = await detector.estimatePoses(video);
            
            // Draw video to canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (poses.length > 0) {
                const keypoints = poses[0].keypoints;
                drawSkeleton(keypoints);
                analyzeForm(keypoints);
            }

            requestAnimationFrame(detectPose);
        }

        function analyzeForm(keypoints) {
            // Map keypoints
            const points = {};
            keypoints.forEach(kp => { points[kp.name] = kp; });

            // Determine which side is more visible
            const leftVisibility = (points.left_hip.score + points.left_knee.score + points.left_ankle.score) / 3;
            const rightVisibility = (points.right_hip.score + points.right_knee.score + points.right_ankle.score) / 3;
            
            const isLeft = leftVisibility > rightVisibility;
            const prefix = isLeft ? 'left_' : 'right_';

            const shoulder = points[`${prefix}shoulder`];
            const hip = points[`${prefix}hip`];
            const knee = points[`${prefix}knee`];
            const ankle = points[`${prefix}ankle`];

            // Ensure we have high enough confidence to calculate
            if (shoulder.score > 0.3 && hip.score > 0.4 && knee.score > 0.4 && ankle.score > 0.4) {
                
                // Calculate Angles
                const kneeAngle = calculateAngle(hip, knee, ankle);
                const hipAngle = calculateAngle(shoulder, hip, knee);
                const torsoAngle = calculateTorsoAngle(shoulder, hip);
                
                // Update Torso UI
                torsoValueEl.innerText = torsoAngle;

                // Determine active angle based on exercise type
                let activeAngle = (currentExercise === "HINGE") ? hipAngle : kneeAngle;

                // Update Angle UI
                angleValueEl.innerText = activeAngle;
                
                // Visual Bar logic (map angle between Down and Up thresholds)
                let barPct = ((activeAngle - ANGLE_DOWN) / (ANGLE_UP - ANGLE_DOWN)) * 100;
                barPct = Math.max(0, Math.min(100, barPct));
                angleBarEl.style.width = `${barPct}%`;
                
                if (activeAngle <= ANGLE_DOWN) {
                    angleBarEl.classList.remove('bg-blue-500');
                    angleBarEl.classList.add('bg-emerald-500');
                } else {
                    angleBarEl.classList.add('bg-blue-500');
                    angleBarEl.classList.remove('bg-emerald-500');
                }

                // State Machine & Hold Logic
                if (activeAngle > ANGLE_UP) {
                    if (currentState === "DOWN" || currentState === "GOING_DOWN") {
                        repCount++;
                        repValueEl.innerText = repCount;
                        
                        // Small animation on rep complete
                        repValueEl.classList.add('text-emerald-400', 'scale-110');
                        setTimeout(() => repValueEl.classList.remove('text-emerald-400', 'scale-110'), 300);
                    }
                    currentState = "UP";
                    stateEl.innerText = "STANDING";
                    stateEl.className = "text-lg sm:text-xl font-black text-blue-400 tracking-tight";
                    
                    // Reset hold timer
                    holdStartTime = 0;
                    currentHoldTime = 0;
                    hasPlayedHoldSound = false;
                    holdValueEl.innerText = "0.0";
                    holdValueEl.classList.remove('text-emerald-400');
                    holdValueEl.classList.add('text-white');

                } else if (activeAngle <= ANGLE_DOWN) {
                    currentState = "DOWN";
                    stateEl.innerText = "HOLDING";
                    stateEl.className = "text-lg sm:text-xl font-black text-emerald-400 tracking-tight";
                    
                    // Handle Timer
                    if (holdStartTime === 0) {
                        holdStartTime = performance.now();
                    }
                    currentHoldTime = (performance.now() - holdStartTime) / 1000;
                    holdValueEl.innerText = currentHoldTime.toFixed(1);

                    // Check for target completion
                    if (currentHoldTime >= targetHoldTime) {
                        holdValueEl.classList.remove('text-white');
                        holdValueEl.classList.add('text-emerald-400');
                        
                        if (!hasPlayedHoldSound && synth) {
                            // Play Chime!
                            synth.triggerAttackRelease("C5", "8n");
                            hasPlayedHoldSound = true;
                        }
                    }

                } else {
                    currentState = "GOING_DOWN";
                    stateEl.innerText = "IN MOTION";
                    stateEl.className = "text-lg sm:text-xl font-black text-amber-400 tracking-tight";
                    
                    holdStartTime = 0;
                    hasPlayedHoldSound = false;
                }
            }
        }

        function drawSkeleton(keypoints) {
            ctx.fillStyle = '#10b981'; // emerald-500
            ctx.strokeStyle = '#3b82f6'; // blue-500
            ctx.lineWidth = 4;

            // Draw connecting lines
            const adjacentKeyPoints = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
            adjacentKeyPoints.forEach(([i, j]) => {
                const kp1 = keypoints[i];
                const kp2 = keypoints[j];

                if (kp1.score > 0.3 && kp2.score > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.stroke();
                }
            });

            // Draw points
            keypoints.forEach(kp => {
                if (kp.score > 0.3) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.stroke();
                }
            });
        }

        async function initApp() {
            try {
                await setupCamera();
                await loadModel();
                
                // Adjust canvas size when window resizes
                window.addEventListener('resize', () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                });

                isRunning = true;
                detectPose();
            } catch (err) {
                console.error(err);
                alert("Error starting app. Please ensure camera permissions are granted.");
                startBtn.innerText = "Error - Check Camera";
            }
        }
    </script>
</body>
</html>
